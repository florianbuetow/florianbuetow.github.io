<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default `en` }}">
<head>
    {{ partial "head.html" . }}
</head>
<body>
<div class="page-wrapper">
    {{ partial "header.html" . }}
    <main id="main-content">
        <div class="container">
            {{ block "main" . }}{{ end }}
        </div>
    </main>
    {{ partial "footer.html" . }}
</div>
<button class="debug-toggle" id="debug-toggle" type="button" hidden>Toggle layout borders</button>
<script>
  (function () {
    var host = window.location.hostname;
    if (host !== 'localhost' && host !== '127.0.0.1') return;
    var btn = document.getElementById('debug-toggle');
    btn.hidden = false;
    btn.addEventListener('click', function () {
      document.body.classList.toggle('debug-layout');
    });
  })();
</script>
<script src="/js/global-search.js" defer></script>
{{ block "scripts" . }}{{ end }}
</body>
</html>
