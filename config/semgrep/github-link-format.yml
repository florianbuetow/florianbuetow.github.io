rules:
  - id: content.github-link-format
    languages: [generic]
    message: >
      Github links must have, as their visible text, either the exact text
      "GitHub", the complete github.com URL, or that URL without the "https://"
      prefix.
    severity: ERROR
    paths:
      include:
        - "**/*.md"
    patterns:
      # A markdown link whose visible text contains "github" (any case) and whose
      # target is a github.com URL.
      - pattern-regex: '(?i)\[[^\]]*github[^\]]*\]\([^)]*github\.com[^)]*\)'
      # Allowed form 1: the text is exactly "GitHub" (case-sensitive).
      - pattern-not-regex: '\[GitHub\]\([^)]*github\.com[^)]*\)'
      # Allowed form 2: the text is a complete github.com URL.
      - pattern-not-regex: '(?i)\[https?://[^\]]*github\.com[^\]]*\]\([^)]*github\.com[^)]*\)'
      # Allowed form 3: the text is the github.com URL with the https:// prefix
      # dropped -- a bare github.com URL token only, with no surrounding prose.
      # github.com must end the text or be followed by a path/query/fragment, so
      # prose ("github.com is great") and other domains ("github.community") that
      # merely start with these characters stay flagged.
      - pattern-not-regex: '(?i)\[github\.com(?:[/#?][^\]\s]*)?\]\([^)]*github\.com[^)]*\)'
